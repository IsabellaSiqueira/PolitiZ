name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # o build roda dentro do webServer do Playwright, apontando para a Câmara simulada
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-dos-testes
          path: test-results
          retention-days: 7

  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # o seed é gerado a partir do conteúdo do app: falha se alguém esquecer de gerar de novo
      - run: npm run banco:seed && git diff --exit-code supabase/seed.sql
      - run: npm run banco:testar
        env:
          BANCO_URL: postgresql://postgres:postgres@localhost:5432/postgres
