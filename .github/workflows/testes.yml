name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # o build roda dentro do webServer do Playwright, apontando para a Câmara simulada
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-dos-testes
          path: test-results
          retention-days: 7
